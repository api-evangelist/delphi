aid: delphi
name: Delphi
description: >-
  Delphi is an AI platform for building "Digital Minds" — hyper-realistic AI
  clones trained exclusively on a person's own content (podcasts, videos, blogs,
  long-form writing, live feeds) that match how they speak, write, and think.
  Audiences can call, text, or video-chat a clone 24/7 for Q&A, coaching,
  mentorship, and engagement, with omnichannel reach across websites, SMS,
  Telegram, Slack, and learning platforms like Kajabi and Thinkific. Delphi's
  v3 REST API (Immortal plan) lets developers embed a Digital Mind directly in
  their own app: create conversations, stream text and voice responses, manage
  the audience and its contextual memory, organize contacts with tags, search
  the clone's knowledge base for RAG, track per-user usage, and receive events
  via signed webhooks. Delphi is backed by Menlo Ventures.
