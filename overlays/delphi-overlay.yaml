overlay: 1.0.0
info:
  title: API Evangelist enhancements for Delphi
  version: 1.0.0
  x-provenance:
    generated: '2026-07-18'
    method: generated
    source: openapi/delphi-openapi.yml
extends: openapi/delphi-openapi.yml
actions:
